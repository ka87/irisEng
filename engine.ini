; The game's settings: where it finds its data, and how it sets the
; display up.
;
; This file belongs beside the executable, which is where the game
; looks for it -- not the working directory, because a game started
; from a shortcut has whatever working directory the shortcut says.
;
; The [data], [render] and [video] sections are optional: without
; them nothing is set and the game runs on its command line alone.
; [display] is not -- the Direct3D renderer will not start without
; its four settings, and says so.
;
; Command line parameters take precedence over everything here.
;
; Lines starting with ; or # are comments. A value may be put in
; double quotes, which is the way to give a name with spaces in it.

[display]
; What the settings application writes, and what the renderer reads.
; adapter is which video card and mode is the display mode's number
; in that card's list.
;
; zbuffer is a Direct3D surface format rather than a number of bits,
; because that is what it is handed to the device as. The ones worth
; asking for: 75 is D24S8 (24 bit depth, 8 bit stencil, and what the
; settings application offers first), 77 is D24X8, 80 is D16, 71 is
; D32. A format the card will not give is a device that will not
; come up, so the settings application only lists the ones it says
; it supports.
;
; windowed is the engine's flag rather than a property of the window:
; it is what the renderer reads when it decides whether to take an
; exclusive display mode. width and height are the window's.
adapter    = 0
mode       = 0
zbuffer    = 75
mipmapping = 1
windowed   = 0
width      = 640
height     = 480

; How many frames a second to draw. Leave this out and the engine
; uses 100, which is not an arbitrary round number: the clock counts
; any frame shorter than a hundredth of a second as a hundredth of a
; second, so a frame that arrives sooner advances the world further
; than real time did and the game runs fast -- a fifth fast at 120Hz,
; very nearly half again at 144Hz. Both renderers present on the
; vertical blank, so without a limit the frame rate is the display's
; and so is the error.
;
; The game has always counted frames that way; it simply never met a
; display this fast. Holding frames back to a hundredth of a second
; leaves that arithmetic untouched and makes it honest again, and a
; display at 60, 75 or 100 is unaffected either way.
;
; A higher limit also lowers the clock's floor to match, so the game
; still runs at the right speed -- at the cost of a constant the game
; shipped with. Set it to your refresh rate if you would rather have
; the frames.
;
; 0 turns the limit off and restores the shipped behaviour exactly,
; fast display and all.
;maxfps     = 100

[data]

; The big file to open. Overridden by a file name given on the
; command line.
bigfile = sally_clean.bf

; Binarized world files, which is what the /B parameter asks for.
; 1, yes, true and on all mean on.
binarized = 1

; The special array, beside the executable. Named here rather than
; compiled in so a build of the file under another name can be tried
; without rebuilding the game. Leave it out for jade.spe.
specialarray = jade.spe

[render]

; Which renderer to use. Names:
;
;   d3d  (or d3d9, direct3d, directx)  the renderer the game shipped
;                                      with, and the default
;   gl   (or opengl, ogl)              OpenGL 4.5 core
;
; The OpenGL renderer is being built and does not draw yet: it comes
; up, clears and presents, and that is all. Ask for it to see it come
; up; leave this at d3d to play the game.
;
; A renderer that cannot run on this machine is not an error: this
; setting is a preference, and the game falls back to the first
; renderer that can run, saying so in the debug output. The same goes
; for a name no renderer answers to.
backend = d3d

[video]

; Fullscreen videos, by the id the script asks for. The key is the
; id and the value is the file to play.
;
; What the scripts push is a 32-bit resource key rather than a small
; index, so an id is written here in hex with a 0x prefix, or in
; decimal if you prefer -- the whole 32-bit range is matched either
; way.
;
; An id with no entry here, or an entry naming a file that cannot be
; opened, plays nothing: it is written to the debug output and the
; game carries on. The log gives the id in hex, which is the spelling
; to paste in here.
;
; The trailer launcher asks for the id below. It chooses between two
; of them on a global it tests, and only this one has been seen, so
; if the other branch is ever taken the log will name the id it
; wanted. Some callers pass a key held in a variable, so the id they
; ask for comes from world data rather than from the script.
0x490294C0 = BGEMakingOf.bik
