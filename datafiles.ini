; Where the game finds its data files.
;
; This file is optional and belongs in the working directory -- the
; folder the game is started from. If it is not there, nothing is set
; from it and the game runs on its command line alone.
;
; Command line parameters take precedence over everything here.
;
; Lines starting with ; or # are comments. A value may be put in
; double quotes, which is the way to give a name with spaces in it.

[data]

; The big file to open. Overridden by a file name given on the
; command line.
bigfile = sally_clean.bf

; Binarized world files, which is what the /B parameter asks for.
; 1, yes, true and on all mean on.
binarized = 1

[render]

; Which renderer to use. Names: d3d (or d3d9, direct3d) for the
; renderer the game shipped with.
;
; A renderer that cannot run on this machine is not an error: this
; setting is a preference, and the game falls back to the first
; renderer that can run, saying so in the debug output. The same goes
; for a name no renderer answers to.
backend = d3d

[video]

; Fullscreen videos, by the id the script asks for. The key is the
; id and the value is the file to play.
;
; What the scripts push is a 32-bit resource key rather than a small
; index, so an id is written here in hex with a 0x prefix, or in
; decimal if you prefer -- the whole 32-bit range is matched either
; way.
;
; An id with no entry here, or an entry naming a file that cannot be
; opened, plays nothing: it is written to the debug output and the
; game carries on. The log gives the id in hex, which is the spelling
; to paste in here.
;
; The trailer launcher asks for the id below. It chooses between two
; of them on a global it tests, and only this one has been seen, so
; if the other branch is ever taken the log will name the id it
; wanted. Some callers pass a key held in a variable, so the id they
; ask for comes from world data rather than from the script.
0x490294C0 = BGEMakingOf.bik
